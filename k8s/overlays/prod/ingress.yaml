apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gymadmin
  namespace: gymadmin-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gym.example.com
      secretName: gymadmin-tls
  rules:
    - host: gym.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gymadmin
                port:
                  number: 80
