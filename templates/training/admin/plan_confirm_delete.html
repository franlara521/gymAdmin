{% extends "base_admin.html" %}
{% block title %}Eliminar plan — GymAdmin{% endblock %}
{% block nav_training %}active{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white">
        <i class="bi bi-exclamation-triangle me-2"></i>Confirmar eliminación
      </div>
      <div class="card-body">
        <p>¿Eliminar el plan <strong>{{ object.title }}</strong>?</p>
        <p class="text-muted small">Se eliminarán también todas sus secciones.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger me-2">
            <i class="bi bi-trash me-1"></i>Sí, eliminar
          </button>
          <a href="{% url 'admin_training:plan_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
