{% extends "base.html" %}

{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand fw-bold" href="{% url 'client_dashboard:dashboard' %}">
      <i class="bi bi-lightning-charge-fill"></i> GymAdmin
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#clientNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="clientNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% block nav_schedule %}{% endblock %}" href="{% url 'client_schedule:schedule' %}">
            <i class="bi bi-calendar3"></i> Horario
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_training %}{% endblock %}" href="{% url 'client_training:plan_list' %}">
            <i class="bi bi-clipboard2-pulse"></i> Mis planes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_messages %}{% endblock %}" href="{% url 'client_messaging:inbox' %}">
            <i class="bi bi-chat-dots"></i> Mensajes
            {% if unread_count %}
              <span id="unread-badge" class="badge bg-danger rounded-pill">{{ unread_count }}</span>
            {% else %}
              <span id="unread-badge"></span>
            {% endif %}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="{% url 'client_dashboard:dashboard' %}">
            <i class="bi bi-bar-chart-line"></i> Dashboard
          </a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i>
            {{ request.user.get_full_name|default:request.user.username }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="{% url 'client:profile' %}"><i class="bi bi-person me-2"></i>Mi perfil</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="dropdown-item text-danger" type="submit">
                  <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                </button>
              </form>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
{% endblock %}
